# ============================================================
# HTTPS 443 模板（H3）：默认【注释态】，不影响 nginx -t。
#
# 三条启用路线，按环境选一条（**只选一条**，否则同一 server_name 出现两个 443 块）：
#
#   A. Cloudflare Origin Certificate ★ 域名挂在 Cloudflare 后面时推荐
#      由部署脚本自动完成：把证书放到目录后执行
#          sudo bash scripts/deploy-linux.sh --domain <DOMAIN> --with-nginx --origin-cert
#          （升级用 update-from-github.sh，参数相同）
#      脚本会：取消下方注释 → 填入 __SSL_CERT__ / __SSL_KEY__ → nginx -t → reload。
#      ★ 关键优点：**不依赖任何 DNS 校验**。Let's Encrypt 的 HTTP-01 要为每个 -d 名字
#        做校验，log.<DOMAIN> 没有 DNS 记录就会让整条签发失败、443 块一个字节都写不进去
#        （真实的 521 事故根因）。Origin Certificate 由 Cloudflare 直接签发，无此问题。
#      另：有效期最长 15 年，无需续期。
#
#   B. Let's Encrypt（certbot 自动接管）
#          certbot --nginx -d <DOMAIN> --non-interactive --redirect
#      ★ **先只签主域**：加上 -d log.<DOMAIN> 而该子域无 DNS 记录时，certbot 会整体中止。
#      certbot 会自行写入它自己的 443 块——届时**不要**再启用下方模板（会重复 server_name）。
#
#   C. 手工：自行取消下方注释、改好证书路径，然后 nginx -t && systemctl reload nginx。
#
# 路径占位符（脚本渲染时替换）：
#   __SSL_CERT__  证书文件（Origin Certificate 的 cert.pem；LE 的 fullchain.pem）
#   __SSL_KEY__   私钥文件（key.pem / privkey.pem）
#
# 端口 80 的 HTTP→HTTPS 跳转**不放在本模板里**（放进来会产生同名的第二个 80 块，
# nginx 只取第一个并报 conflicting server name，新块形同失效——静默无效最坑人）。
# 两种干净做法：
#   - 走 Cloudflare：在 CF 面板开 Always Use HTTPS（一个开关，不动源站，推荐）；
#   - 不用 CF：把上面 80 端口 server 块的 body 换成一行 return 301 https://$host$request_uri;
# HSTS 同理保持注释：确认 HTTPS 稳定后再手动开启。
# ============================================================
# === NGINX_SSL_443_START ===
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name __DOMAIN__;
#
#     ssl_certificate     __SSL_CERT__;
#     ssl_certificate_key __SSL_KEY__;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # HSTS：确认 HTTPS 稳定后再取消本行注释（浏览器会强制 HTTPS，缓存 1 年）
#     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # 安全响应头（L1）
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-Frame-Options "SAMEORIGIN" always;
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#     add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
#     add_header X-XSS-Protection "1; mode=block" always;
#
#     client_max_body_size 128m;
#     root __INSTALL_DIR__/frontend-dist;
#     index index.html;
#
#     location /api/ {
#         proxy_pass         http://gipfel_django;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
