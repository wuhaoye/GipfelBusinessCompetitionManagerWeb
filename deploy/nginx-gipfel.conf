# nginx 虚拟主机：Gipfel Business Competition Manager
#
# 部署：
#   1) 将本文件放到 /etc/nginx/sites-available/gipfel.conf
#   2) ln -s ../sites-available/gipfel.conf /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) （可选）certbot --nginx -d comp.example.com

# ============================================================
# C3 限流 zone 与访问日志格式
#
# ★ 位置要求：`limit_req_zone` / `limit_conn_zone` / `log_format` 只能定义在 **http 上下文**。
#   本文件被 include 进 nginx.conf 的 http{} 内，所以写在「文件顶层」（任何 server{} 之外）
#   才是正确的；写进 server{} 会让 `nginx -t` 直接报
#   `"limit_req_zone" directive is not allowed here`。
#
# ★ 计数器按 `$binary_remote_addr`（客户端 IP）聚合。本赛事的典型场景是
#   **全场 100 个客户端经同一个 NAT / 出口 IP 上网**，所以所有阈值都必须按
#   「一个 IP 后面站着 100 个客户端」来估，绝不能按「一个 IP = 一个人」来估 ——
#   这是最容易误伤正常操作的地方（限流过严 = 选手点不动按钮，比不加限流更糟）。
#
# ★ 若站点前面挂了 Cloudflare/CDN 而**没有**配置真实客户端 IP
#   （见 deploy/README.md「经 CDN 后的客户端 IP」一节的 set_real_ip_from / real_ip_header），
#   那么 `$remote_addr` 是 CDN 节点 IP，全场流量会被归入同一个计数器。
#   本文件的阈值已按「最坏情况下全网只算一个 IP」留了余量；未配真实 IP 前请勿自行调低。
# ============================================================

# ★ 现场换算表（所有阈值的统一估算口径，改数值前先按它算一遍）：
#   · 正常单客户端：≤ 5 req/s（人手点击；一次操作最多并发 3~4 个请求）
#   · 100 客户端稳态心跳：100 / 20s = 5 req/s；页面隐藏后心跳拉长到 60s → ≈1.7 req/s
#     （C3 前端改造：可见 20s / 隐藏 60s，条件请求 304 不算业务负载）
#   · 100 客户端重连尖峰：原估算 100×10 + 5×20 ≈ 1100 个请求瞬时涌来；C3 前端已加
#     「并发上限 2 + 指数退避与抖动 + 产业字段批量端点」，尖峰被**摊平到数秒**，
#     不再是同一毫秒叠加 → burst 只要能吸收"摊平后头一两秒"的量即可
#   · 同一出口 IP 的在途请求数：100 客户端 × 每端 1~2 个 = 100~200
#   · 若现场仍见 429：**先看 access log 的 rt=/urt=$request_time 与实际速率**（判断是真
#     流量超限还是阈值过严），再按 zone 调 rate/burst；**不要直接删掉限流** ——
#     删掉等于把重连尖峰原样丢给后端（这正是 C3 要消除的场景）。
# ============================================================

# /api/ 常规接口：120 r/s/IP。
#   依据（**Debian 13 真机压测实测**，100 客户端，全部流量来自同一个出口 IP = 最坏情况）：
#     S1 稳态（100 客户端心跳 300 请求，分 3 轮）：300×200，0 个 429（两种阈值都过）
#     S2 改造前形态尖峰（100×11 = 1100 请求瞬时）：
#          60r/s+burst120  → 151 通过 / 949 个 429；120r/s+burst240 → 391 通过 / 709 个 429
#          两者后端均存活（压测后 /api/health=200）
#     S3 改造后形态（100×2 = 200 请求：心跳 + 产业字段批量端点，**无抖动**）：
#          60r/s+burst120  → 136 通过 / **64 个 429**  ← 会误伤
#          120r/s+burst240 → **200 通过 / 0 个 429** ✅
#     S3b 改造后形态 + 前端启动抖动 0–1s：
#          60r/s+burst120  → 179 通过 / **21 个 429**  ← 仍会误伤
#          120r/s+burst240 → **200 通过 / 0 个 429** ✅
#     S4 /api/health 200 瞬时请求：0 个 429（health 不限流）
#   结论：C3 前端把重连请求从 ~1100 降到 ~200，但**「全场同一个 NAT 出口 IP」下 60r/s
#   仍会拦掉 10%~32% 的正常重连**；120r/s + burst=240 在真实场景下 0 个 429，
#   而最坏风暴仍拦掉 709/1100（后端全程存活）—— 保护能力足够，误伤消失。
#   burst=240（配 nodelay）：允许约 2 秒的摊平尖峰被**立即**服务、不排队、不加延迟。
#   超过 burst 的那部分才返回 429（此时后端确实已经过载，429 比雪崩式超时更好）。
#   ★ 数值来源：`docs/真机验证报告-Debian13.md`（含复现脚本 logs/vmtest/load_test.py 与 load_compare.sh）。
limit_req_zone $binary_remote_addr zone=gipfel_api_rl:10m rate=120r/s;

# /api/auth/login：比 /api/ 更严，但**只严在"挡风暴"，不承担防爆破**。
#   依据：真正的爆破防线是应用层 LoginRateLimitMiddleware
#   （apps/common/middleware.py：同 IP+用户名 5 分钟内失败 10 次 → 锁定 15 分钟，返回 429）；
#   nginx 这层如果按"单人登录频率"设阈值，就会误伤本项目的关键场景 ——
#   **开场时 100 个选手几乎同时登录，且很可能共用同一个 NAT 出口 IP**：
#     旧值 5r/s + burst=40 会让第 41 个之后的登录直接吃 429（现场表现为"登录按钮转圈后报错"，
#     且完全看不出是限流），属于典型误伤。
#   现值 20 r/s + burst=120 nodelay：前 120 个瞬时登录全部放行，其余按 20 r/s 排空，
#   100~200 人规模的开场登录不会失败；相对于 /api/ 的 120 r/s 仍是 1/6（"更严"的语义保留），
#   而 bcrypt 校验的昂贵程度由应用层锁定兜底，不依赖 nginx。
#   ★ 不要把 rate 降到 5r/s 以下、burst 降到 100 以下：同一出口 IP 的全场登录会开始丢人。
limit_req_zone $binary_remote_addr zone=gipfel_login_rl:10m rate=20r/s;

# 连接数兜底（不是限速）：只用于切断病态连接数（脚本/被劫持客户端狂开连接）。
#   600 的推导（**取最保守口径**）：100 客户端 × 每端 2~6 条同源连接 = 200~600
#   —— 即便假设浏览器对同一源常驻的多条连接**全部**被计入，也不会误伤。
#   ★ 实际计数口径比这更宽松（nginx 官方文档 + 作者 Maxim Dounin 在 nginx 邮件列表的澄清）：
#     limit_conn **只统计"正在处理请求"的连接**（请求头已读完、请求尚未处理完），
#     请求处理完进入空闲 keepalive 后**不再计数** —— 见
#     https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
#     与 http://mailman.nginx.org/pipermail/nginx/2017-December/055322.html。
#     所以真实计数 ≈ 100~200（每端在途 1~2 个请求），600 是刻意留 3 倍余量的安全上限：
#     限流是"保护后端的兜底"，不应该变成常态限制 —— 让排队发生在 gunicorn
#     （4 worker × 8 线程 = 32 路 + SQLite busy_timeout=20s），而不是被 nginx 用 429 提前掐断。
#     真正挡洪水的是上面的 120 r/s 速率限制；600 只负责挡住"狂开连接"这类病态行为。
#   ★ 若后续要收紧：先确认已配真实客户端 IP（CDN 场景），再按 access log 的真实在途连接数调。
limit_conn_zone $binary_remote_addr zone=gipfel_api_conn:10m;

# /socket.io/ 长连接：100 客户端 = 100 条常驻连接（socket 是长连接，请求全程"在处理中"，
#   因此**整条连接生命周期**都被计数）；Wi-Fi 抖动后重连时旧连接会在 socket 超时前与新连接
#   短暂并存 → 200 = 100 + 100 条重连/双标签页余量。
limit_conn_zone $binary_remote_addr zone=gipfel_socket_conn:10m;

# 超限返回码：默认 503 会被前端/监控当成"服务端故障"（并可能触发全局错误提示与重连风暴），
# 而 429（Too Many Requests）语义明确"请求过频、可重试" → 统一 429（设计说明 §4.4 硬性要求）。
limit_req_status 429;
limit_conn_status 429;

# 访问日志格式：新增 $request_time（总耗时）与上游耗时三段，现场才能回答"哪个请求慢、
#   慢在 nginx 还是慢在后端"（C3 可观测性要求）。
#   ★ 名字 `gipfel_rt` 必须全站唯一：若 nginx.conf 或其它 vhost 里已定义同名 log_format，
#     `nginx -t` 会报 `duplicate log format`。改名时请同步本文件里的 access_log 引用。
#   ★ 只有把格式名写进 access_log（见下方主 server 与 443 模板块），$request_time 才真正落盘。
log_format gipfel_rt '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'uht=$upstream_header_time urt=$upstream_response_time';

# ============================================================
# C1-a 上游拆分：HTTP 短请求（WSGI，多 worker）与 Socket.IO 长连接（ASGI）分成两组进程
# ============================================================
upstream gipfel_django {
    # gunicorn（WSGI）本地监听 127.0.0.1:8002 —— deploy/gipfel-wsgi.service
    # （端口默认值 GIPFEL_WSGI_PORT=8002，可被 backend/.env 覆盖；
    #   改端口时这里与 unit 的 Environment/EnvironmentFile 必须一起改）
    server 127.0.0.1:8002 fail_timeout=3s max_fails=3;
    keepalive 32;
}

upstream gipfel_socketio {
    # daphne（ASGI）本地监听 127.0.0.1:8000 —— deploy/gipfel.service（原样保留）
    # 只有它持有 Socket.IO 连接与进程内事件环（REALTIME_BUS=hub），
    # 因此 /socket.io/ **必须**走这个上游；其余 HTTP 走上面的 gipfel_django。
    server 127.0.0.1:8000 fail_timeout=3s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ------------------------------
    # 安全响应头（L1）：防 MIME 嗅探 / 点击劫持 / 信息泄露
    #   注意：add_header 在 location 自带 add_header 时不会继承，故 /uploads/、/static/
    #   两个 location 需各自显式补回（见下）。
    # ------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端 body 上限：支持模型导入 JSON、文件上传、股票批量下单
    client_max_body_size 128m;
    client_body_timeout 60s;
    send_timeout 60s;

    # 静态资源：前端 build 产物
    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    # 日志
    # ★ 带上自定义格式 `gipfel_rt`（定义见文件顶层）—— 否则 $request_time 不会落到 access.log，
    #   现场就无法定位"哪个请求慢"（C3 可观测性）。格式名与 log_format 必须成对出现。
    access_log /var/log/nginx/gipfel.access.log gipfel_rt;
    error_log  /var/log/nginx/gipfel.error.log warn;

    # ------------------------------
    # 登录：单独更严的限流 zone（见文件顶层 gipfel_login_rl 的取值依据）
    #   精确匹配（=）优先于下方 /api/ 前缀匹配，故本块只作用于 /api/auth/login。
    #   ★ 这层只"挡风暴"（20 r/s + burst 120）：防爆破由应用层
    #   LoginRateLimitMiddleware（同 IP+用户名 10 次/5 分钟 → 锁 15 分钟）负责，
    #   按"单人登录频率"设 nginx 阈值会误伤"开场 100 人共用同一出口 IP 同时登录"。
    # ------------------------------
    location = /api/auth/login {
        limit_req  zone=gipfel_login_rl burst=120 nodelay;
        limit_conn gipfel_api_conn 600;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # Django 后端 API（C1-a：由 gunicorn/WSGI 承载，多 worker 多线程）
    #   C3 限流：120 r/s + burst 240，按客户端 IP 聚合，按「全场 100 客户端可能共用
    #   一个 NAT 出口 IP」实测校准（依据与真机压测数据见文件顶层 zone 注释）。
    # ------------------------------
    location /api/ {
        limit_req  zone=gipfel_api_rl burst=240 nodelay;
        limit_conn gipfel_api_conn 600;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # Socket.IO：必须是 /socket.io/ 前缀 + Upgrade 头正确转发
    #   C1-a：上游是 daphne（127.0.0.1:8000）而不是 WSGI —— 只有 daphne 持有 socket 连接
    #   与事件环；把这里指到 gipfel_django(8002) 会导致握手失败/实时广播全丢。
    #   C3：**只限连接数、不限速**。Socket.IO 的心跳（ping 25s）与 polling 兜底是持续小流量，
    #   一旦被 limit_req 限速，表现就是"莫名断线 → 全场重连风暴"，正是 C3 要消除的放大效应。
    #   200 = 100 客户端常驻连接 + 100 条重连/双标签页并存余量（见顶层 gipfel_socket_conn 注释）。
    # ------------------------------
    location /socket.io/ {
        limit_conn gipfel_socket_conn 200;
        proxy_pass         http://gipfel_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 长连接，允许整日不断
        proxy_send_timeout  86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ------------------------------
    # 用户上传的文件 /uploads/* → backend/uploads
    # ------------------------------
    location /uploads/ {
        alias __INSTALL_DIR__/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # 限制 MIME（L5）：仅放行图片/PDF，其余一律 octet-stream，
        # 防上传文件被浏览器当作 HTML/JS 执行（配合下方 X-Content-Type-Options=nosniff）。
        types {
            image/jpeg   jpg jpeg;
            image/png    png;
            image/gif    gif;
            image/webp   webp;
            application/pdf pdf;
        }
        default_type application/octet-stream;
        # 禁止执行任何脚本类文件，防上传文件 RCE
        location ~* /uploads/.*\.(php|pl|py|cgi|asp|aspx|sh|rb|phtml)$ { deny all; }
        try_files $uri =404;
    }

    # ------------------------------
    # 健康检查 /api/health 直接透传
    #   ★ C3 硬性要求：**本 location 不限流**。监控/部署探针必须永远能通过，
    #     否则"限流生效"会被误判成"后端挂了"，部署脚本也会因此报部署失败。
    #     实现方式：limit_req / limit_conn **只写在**上方的 = /api/auth/login、/api/、
    #     /socket.io/ 三个 location 内部（不写 server 级），因此本块不继承任何限流。
    #     ⚠️ 后续维护：不要为了"省事"把 limit_* 提到 server 级 —— 那会连带限掉本 location。
    # ------------------------------
    location = /api/health {
        access_log off;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ------------------------------
    # 静态资源（collectstatic 产物）：Django admin 等
    # ------------------------------
    location /static/ {
        alias __INSTALL_DIR__/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # ------------------------------
    # 后端管理后台 /admin/* → Django admin（受防直连网关保护）
    #   前端「后端管理界面」按钮携带一次性令牌跳转 /admin/?token=... 方可进入；
    #   直接输入网址会被 BackendGateMiddleware 302 重定向回前端 SPA。
    #   必须显式代理：否则会被下方 SPA 兜底 location / 吞掉，返回 index.html（公网管理后台不可达）。
    #   C1-a：与 /api/ 一样走 gipfel_django（WSGI/gunicorn）。
    #   C3：**有意不加限流** —— 管理后台是人工低频操作，且运维往往也在同一个出口 IP 后面；
    #   给它套 NAT 共享的限流只会把运维自己锁在门外，收益为零（它不在公网暴露的 API 热路径上）。
    # ------------------------------
    location /admin/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # SPA 兜底：前端 router 的 history 模式，所有非 API/非静态路由返回 index.html
    #           注意此段放在 API / socket.io / uploads / static / admin 之后，避免吞掉真实 404
    # ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问以点开头的隐藏文件
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# ============================================================
# 日志查看器（独立 Django 站点）：整站代理到 127.0.0.1:8121（日志查看器 daphne 仅绑内网 8121，
#   公网 8120 由本 nginx 块监听并反代，避免与 daphne 抢同一端口导致 nginx 起不来）
# ------------------------------------------------------------
# 为什么是整站代理：
#   - 日志查看器 STATIC_URL 为 /static/，nginx 不能用「带前缀的路径代理」，
#     否则 /static/ 资源会被错误改写；必须整站（/）代理。
# 部署形态二选一（由 deploy-linux.sh 按是否传入 --domain 决定保留哪一块，
#   另一块在生成 vhost 时被 sed 删除）：
#   * 有域名：LOGVIEWER_SUBDOMAIN 块 —— log.<DOMAIN> 子域（端口 80，建议 certbot 覆盖），
#     与主站点隔离 cookie 命名空间，避免冲突。
#   * 无域名（纯 IP）：LOGVIEWER_PORT8120 块 —— 监听 __LOG_VIEWER_PORT__ 端口（默认 8120，
#     取自 .env 的 LOG_VIEWER_PORT，可改），server_name _ 走纯 IP 匹配，
#     经 http://<IP>:8120/ 访问，无需 DNS 子域（适合还没买域名的阶段）。
# 前置条件（运维侧，仅「有域名」形态需要）：
#   - DNS：log.<DOMAIN> 的 A 记录指向本服务器；
#   - 证书：certbot 需覆盖该子域（见 deploy-linux.sh 的 certbot 命令，已纳入 -d log.<DOMAIN>）。
#     未启用 HTTPS 时本块以 HTTP 提供服务，cookie 非 Secure，功能正常。
# 防直连：直接访问根路径会被日志查看器 403 拒绝；
#   仅前端「系统设置 → 日志查看器」按钮携带一次性令牌跳转方可进入。
# ============================================================

# === LOGVIEWER_SUBDOMAIN_START ===
server {
    listen 80;
    listen [::]:80;
    server_name log.__DOMAIN__;

    # 安全响应头（L1）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/gipfel-logviewer.access.log;
    error_log  /var/log/nginx/gipfel-logviewer.error.log warn;

    # 静态资源（collectstatic 产物）：nginx 直接托管，避免依赖 Django 生产服务静态
    location /static/ {
        alias __INSTALL_DIR__/backend/logviewer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # 整站代理到日志查看器（daphne @ 127.0.0.1:8121）
    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        # 关键：Host 必须带端口（$host 不含端口，会导致 Django 同源 CSRF 判定
        # Origin(http://IP:8120) != get_host()(IP) → 登录 403）。用 $host:$server_port
        # 透传浏览器原始 Host（含 8120），使 Django「同源自动放行」生效。
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
# === LOGVIEWER_SUBDOMAIN_END ===

# === LOGVIEWER_PORT8120_START ===
# 占位符 __LOG_VIEWER_PORT__：由 deploy-linux.sh / update-from-github.sh 渲染时
# 替换为 .env 的 LOG_VIEWER_PORT（默认 8120）；非 IP 字面量会被 sed 直接插入。
# 注意：这里 listen 端口必须 != logviewer.service 中 daphne 绑定的 127.0.0.1:8121
# （避免同机抢端口）；改 LOG_VIEWER_PORT 不会动 8121 内部端口，是设计如此。
server {
    listen __LOG_VIEWER_PORT__;
    listen [::]:__LOG_VIEWER_PORT__;
    server_name _;

    # 安全响应头（L1）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/gipfel-logviewer.access.log;
    error_log  /var/log/nginx/gipfel-logviewer.error.log warn;

    # 静态资源（collectstatic 产物）：nginx 直接托管，避免依赖 Django 生产服务静态
    location /static/ {
        alias __INSTALL_DIR__/backend/logviewer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # 整站代理到日志查看器（daphne @ 127.0.0.1:8121）
    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        # 关键：Host 必须带端口（$host 不含端口，会导致 Django 同源 CSRF 判定
        # Origin(http://IP:8120) != get_host()(IP) → 登录 403）。用 $host:$server_port
        # 透传浏览器原始 Host（含 8120），使 Django「同源自动放行」生效。
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
# === LOGVIEWER_PORT8120_END ===

