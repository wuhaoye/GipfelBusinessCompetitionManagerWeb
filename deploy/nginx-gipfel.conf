# ------------------------------------------------------------
# 日志查看器子域的 443 块（与上面主站块成对启用）
#
# 证书可共用同一份：申请 Origin Certificate 时把 log.<DOMAIN> 一并写进 Hostnames
# （或直接用 *.domain 通配），两个 server 块指向同一 __SSL_CERT__ / __SSL_KEY__。
#
# ★ 为什么必须有这一块：前端「日志查看器」按钮的地址由后端派生成
#   https://log.<DOMAIN>/（backend/apps/auth/views.py）。没有对应的 443 server 块时，
#   请求会落到默认 443 server（显示主站或证书不匹配），表现为「日志查看器打不开」。
#
# ⚠️ 规约：NGINX_SSL_443* 标记区域内**只允许放「注释形式的 nginx 配置」**，
#    任何说明文字都必须写在标记行**之外**（就像本段这样）。
#    原因：脚本用 sed 把区域内每一行取消一层注释，混进散文会变成
#    `unknown directive "日志查看器子域的"` —— 曾真实发生过。
#    区域内需要写注释时，用两层井号（`#     # 说明`）：取消一层后仍是注释。
