# nginx 虚拟主机：Gipfel Business Competition Manager
#
# 部署：
#   1) 将本文件放到 /etc/nginx/sites-available/gipfel.conf
#   2) ln -s ../sites-available/gipfel.conf /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) （可选）certbot --nginx -d comp.example.com

upstream gipfel_django {
    # Django daphne 本地监听 127.0.0.1:8000
    server 127.0.0.1:8000 fail_timeout=3s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ------------------------------
    # 安全响应头（L1）：防 MIME 嗅探 / 点击劫持 / 信息泄露
    #   注意：add_header 在 location 自带 add_header 时不会继承，故 /uploads/、/static/
    #   两个 location 需各自显式补回（见下）。
    # ------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端 body 上限：支持模型导入 JSON、文件上传、股票批量下单
    client_max_body_size 128m;
    client_body_timeout 60s;
    send_timeout 60s;

    # 静态资源：前端 build 产物
    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/gipfel.access.log;
    error_log  /var/log/nginx/gipfel.error.log warn;

    # ------------------------------
    # Django 后端 API
    # ------------------------------
    location /api/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # Socket.IO：必须是 /socket.io/ 前缀 + Upgrade 头正确转发
    # ------------------------------
    location /socket.io/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 长连接，允许整日不断
        proxy_send_timeout  86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ------------------------------
    # 用户上传的文件 /uploads/* → backend/uploads
    # ------------------------------
    location /uploads/ {
        alias __INSTALL_DIR__/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # 限制 MIME（L5）：仅放行图片/PDF，其余一律 octet-stream，
        # 防上传文件被浏览器当作 HTML/JS 执行（配合下方 X-Content-Type-Options=nosniff）。
        types {
            image/jpeg   jpg jpeg;
            image/png    png;
            image/gif    gif;
            image/webp   webp;
            application/pdf pdf;
        }
        default_type application/octet-stream;
        # 禁止执行任何脚本类文件，防上传文件 RCE
        location ~* /uploads/.*\.(php|pl|py|cgi|asp|aspx|sh|rb|phtml)$ { deny all; }
        try_files $uri =404;
    }

    # ------------------------------
    # 健康检查 /api/health 直接透传
    # ------------------------------
    location = /api/health {
        access_log off;
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ------------------------------
    # 静态资源（collectstatic 产物）：Django admin 等
    # ------------------------------
    location /static/ {
        alias __INSTALL_DIR__/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # ------------------------------
    # 后端管理后台 /admin/* → Django admin（受防直连网关保护）
    #   前端「后端管理界面」按钮携带一次性令牌跳转 /admin/?token=... 方可进入；
    #   直接输入网址会被 BackendGateMiddleware 302 重定向回前端 SPA。
    #   必须显式代理：否则会被下方 SPA 兜底 location / 吞掉，返回 index.html（公网管理后台不可达）。
    # ------------------------------
    location /admin/ {
        proxy_pass         http://gipfel_django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------
    # SPA 兜底：前端 router 的 history 模式，所有非 API/非静态路由返回 index.html
    #           注意此段放在 API / socket.io / uploads / static / admin 之后，避免吞掉真实 404
    # ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问以点开头的隐藏文件
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# ============================================================
# 日志查看器（独立 Django 站点）：整站代理到 127.0.0.1:8121（日志查看器 daphne 仅绑内网 8121，
#   公网 8120 由本 nginx 块监听并反代，避免与 daphne 抢同一端口导致 nginx 起不来）
# ------------------------------------------------------------
# 为什么是整站代理：
#   - 日志查看器 STATIC_URL 为 /static/，nginx 不能用「带前缀的路径代理」，
#     否则 /static/ 资源会被错误改写；必须整站（/）代理。
# 部署形态二选一（由 deploy-linux.sh 按是否传入 --domain 决定保留哪一块，
#   另一块在生成 vhost 时被 sed 删除）：
#   * 有域名：LOGVIEWER_SUBDOMAIN 块 —— log.<DOMAIN> 子域（端口 80，建议 certbot 覆盖），
#     与主站点隔离 cookie 命名空间，避免冲突。
#   * 无域名（纯 IP）：LOGVIEWER_PORT8120 块 —— 监听 __LOG_VIEWER_PORT__ 端口（默认 8120，
#     取自 .env 的 LOG_VIEWER_PORT，可改），server_name _ 走纯 IP 匹配，
#     经 http://<IP>:8120/ 访问，无需 DNS 子域（适合还没买域名的阶段）。
# 前置条件（运维侧，仅「有域名」形态需要）：
#   - DNS：log.<DOMAIN> 的 A 记录指向本服务器；
#   - 证书：certbot 需覆盖该子域（见 deploy-linux.sh 的 certbot 命令，已纳入 -d log.<DOMAIN>）。
#     未启用 HTTPS 时本块以 HTTP 提供服务，cookie 非 Secure，功能正常。
# 防直连：直接访问根路径会被日志查看器 403 拒绝；
#   仅前端「系统设置 → 日志查看器」按钮携带一次性令牌跳转方可进入。
# ============================================================

# === LOGVIEWER_SUBDOMAIN_START ===
server {
    listen 80;
    listen [::]:80;
    server_name log.__DOMAIN__;

    # 安全响应头（L1）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/gipfel-logviewer.access.log;
    error_log  /var/log/nginx/gipfel-logviewer.error.log warn;

    # 静态资源（collectstatic 产物）：nginx 直接托管，避免依赖 Django 生产服务静态
    location /static/ {
        alias __INSTALL_DIR__/backend/logviewer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # 整站代理到日志查看器（daphne @ 127.0.0.1:8121）
    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        # 关键：Host 必须带端口（$host 不含端口，会导致 Django 同源 CSRF 判定
        # Origin(http://IP:8120) != get_host()(IP) → 登录 403）。用 $host:$server_port
        # 透传浏览器原始 Host（含 8120），使 Django「同源自动放行」生效。
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
# === LOGVIEWER_SUBDOMAIN_END ===

# === LOGVIEWER_PORT8120_START ===
# 占位符 __LOG_VIEWER_PORT__：由 deploy-linux.sh / update-from-github.sh 渲染时
# 替换为 .env 的 LOG_VIEWER_PORT（默认 8120）；非 IP 字面量会被 sed 直接插入。
# 注意：这里 listen 端口必须 != logviewer.service 中 daphne 绑定的 127.0.0.1:8121
# （避免同机抢端口）；改 LOG_VIEWER_PORT 不会动 8121 内部端口，是设计如此。
server {
    listen __LOG_VIEWER_PORT__;
    listen [::]:__LOG_VIEWER_PORT__;
    server_name _;

    # 安全响应头（L1）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/gipfel-logviewer.access.log;
    error_log  /var/log/nginx/gipfel-logviewer.error.log warn;

    # 静态资源（collectstatic 产物）：nginx 直接托管，避免依赖 Django 生产服务静态
    location /static/ {
        alias __INSTALL_DIR__/backend/logviewer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 安全响应头（L1）：本 location 自带 add_header，需显式补回
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # 整站代理到日志查看器（daphne @ 127.0.0.1:8121）
    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        # 关键：Host 必须带端口（$host 不含端口，会导致 Django 同源 CSRF 判定
        # Origin(http://IP:8120) != get_host()(IP) → 登录 403）。用 $host:$server_port
        # 透传浏览器原始 Host（含 8120），使 Django「同源自动放行」生效。
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
# === LOGVIEWER_PORT8120_END ===

# ------------------------------------------------------------
# 日志查看器：域名 + 非标准 TLS 端口（Cloudflare 代理「自定义端口」形态）
#
# 何时需要：域名挂在 Cloudflare 后面（橙云）时，**CF 只代理固定端口**——
#     HTTP  80 / 8080 / 8880 / 2052 / 2082 / 2086 / 2095
#     HTTPS 443 / 2053 / 2083 / 2087 / 2096 / 8443
#   （见 Cloudflare 官方 Network ports 文档）
#   默认的 8120 **不在其中**，所以 `http://<域名>:8120/` 永远连不上——CF 边缘不服务该端口，
#   请求到不了源站。该形态只适用于「无域名、直连 IP」的部署。
#
# 若又不能加 log.<域名> 三级记录（例如域名是别人给的子域），就走本块：
#   同一个主机名换到 CF 支持的 HTTPS 端口（默认 8443）。
#
# 由部署脚本启用（**8443 是默认值，不必手传端口**）：
#     --origin-cert
#   要换端口：--logviewer-tls-port <端口>；走 log.<域名> 子域形态则用 --no-logviewer-tls 关闭。
#   脚本会把 LOG_VIEWER_PUBLIC_URL 写成 https://<域名>:8443/，前端「日志查看器」按钮
#   即指向它；另需在**云安全组**入方向放行 TCP 8443（脚本管不到云侧）。
#   证书可复用主站那份（Origin Certificate 的 Hostnames 含 <域名> 即可，无需 log.）。
#
# ⚠️ 与上面 NGINX_SSL_443* 区域同一规约：**标记区域内只放注释形式的 nginx 配置**，
#    说明文字一律写在标记行之外（脚本会把区域内每一行取消一层注释）。
